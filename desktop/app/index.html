<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Wallet</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0e1117; color: #e5e7eb; }
      #splash { display: flex; align-items: center; justify-content: center; height: 100vh; }
      #splash svg { width: 2.5rem; height: 2.5rem; animation: spin 1s linear infinite; color: #6b7280; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable right-click context menu and DevTools shortcuts
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) e.preventDefault();
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) e.preventDefault();
      });
    </script>
  </body>
</html>
