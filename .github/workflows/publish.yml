name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: windows,linux,mac,android,ios or 'all')"
        required: false
        default: "all"

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  # ── Determine which platforms to build ──────────────────
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.set.outputs.desktop }}
      build-android: ${{ steps.set.outputs.android }}
      build-ios: ${{ steps.set.outputs.ios }}
    steps:
      - id: set
        run: |
          INPUT="${{ github.event.inputs.platforms || 'all' }}"

          # Desktop matrix
          if [[ "$INPUT" == "all" ]]; then
            echo 'desktop=[{"rid":"win-x64","os":"windows-latest"},{"rid":"win-arm64","os":"windows-latest"},{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"linux-arm64","os":"ubuntu-latest"},{"rid":"osx-x64","os":"macos-14"},{"rid":"osx-arm64","os":"macos-latest"}]' >> "$GITHUB_OUTPUT"
            echo "android=true"  >> "$GITHUB_OUTPUT"
            echo "ios=true"      >> "$GITHUB_OUTPUT"
          else
            MATRIX="["
            SEP=""
            if echo "$INPUT" | grep -qi "windows"; then
              MATRIX="${MATRIX}${SEP}{\"rid\":\"win-x64\",\"os\":\"windows-latest\"},{\"rid\":\"win-arm64\",\"os\":\"windows-latest\"}"
              SEP=","
            fi
            if echo "$INPUT" | grep -qi "linux"; then
              MATRIX="${MATRIX}${SEP}{\"rid\":\"linux-x64\",\"os\":\"ubuntu-latest\"},{\"rid\":\"linux-arm64\",\"os\":\"ubuntu-latest\"}"
              SEP=","
            fi
            if echo "$INPUT" | grep -qi "mac"; then
              MATRIX="${MATRIX}${SEP}{\"rid\":\"osx-x64\",\"os\":\"macos-14\"},{\"rid\":\"osx-arm64\",\"os\":\"macos-latest\"}"
              SEP=","
            fi
            MATRIX="${MATRIX}]"

            # Default to all desktop if only mobile was selected
            if [[ "$MATRIX" == "[]" ]]; then
              MATRIX='[{"rid":"win-x64","os":"windows-latest"},{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"osx-arm64","os":"macos-latest"}]'
            fi

            echo "desktop=${MATRIX}" >> "$GITHUB_OUTPUT"
            echo "android=$(echo $INPUT | grep -qi android && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "ios=$(echo $INPUT | grep -qi ios && echo true || echo false)"         >> "$GITHUB_OUTPUT"
          fi

  # ── Build React frontend (shared across all targets) ───
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install & build frontend
        working-directory: desktop/app
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: desktop/app/dist/
          retention-days: 1

  # ── Desktop builds (matrix) ────────────────────────────
  desktop:
    needs: [matrix-setup, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-setup.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: desktop/app/dist/

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish desktop/backend/NeoWallet.Backend.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output publish/${{ matrix.rid }}
        shell: bash

      - name: Create archive
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a -tzip ../../NeoWallet-${{ matrix.rid }}.zip .
          else
            chmod +x NeoWallet.Backend
            tar czf ../../NeoWallet-${{ matrix.rid }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: NeoWallet-${{ matrix.rid }}
          path: NeoWallet-${{ matrix.rid }}.*
          retention-days: 30

  # ── Android build (Tauri Mobile) ────────────────────────
  android:
    needs: [matrix-setup]
    if: needs.matrix-setup.outputs.build-android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: Install frontend deps
        working-directory: desktop/app
        run: npm ci

      - name: Init Tauri Android
        working-directory: desktop/app
        run: npx tauri android init

      - name: Build Android APK (debug)
        working-directory: desktop/app
        run: npx tauri android build --debug

      - name: Collect APK
        run: |
          mkdir -p publish/android
          find desktop/app/src-tauri/gen/android -name "*.apk" -path "*/debug/*" -exec cp {} publish/android/NeoWallet.apk \; 2>/dev/null || true
          # Fallback: look in the target directory
          if [ ! -f publish/android/NeoWallet.apk ]; then
            find desktop/app/src-tauri -name "*.apk" -exec cp {} publish/android/NeoWallet.apk \; 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: NeoWallet-android
          path: publish/android/NeoWallet.apk
          retention-days: 30

  # ── iOS build (Tauri Mobile + Xcode) ───────────────────
  ios:
    needs: [matrix-setup]
    if: needs.matrix-setup.outputs.build-ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: Install frontend deps
        working-directory: desktop/app
        run: npm ci

      - name: Init Tauri iOS
        working-directory: desktop/app
        run: npx tauri ios init

      - name: Build iOS (unsigned)
        working-directory: desktop/app
        run: npx tauri ios build -- --allow-provisioning-updates CODE_SIGNING_ALLOWED=NO
        continue-on-error: true

      - name: Collect build output
        run: |
          mkdir -p publish/ios
          find desktop/app/src-tauri -name "*.app" -o -name "*.xcarchive" | head -5
          # Copy whatever Tauri produced
          find desktop/app/src-tauri/gen/apple -name "*.xcarchive" -exec cp -R {} publish/ios/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: NeoWallet-ios
          path: publish/ios/
          retention-days: 30

  # ── Create GitHub Release on tag push ──────────────────
  release:
    needs: [desktop, android, ios]
    # Run on tag push even if some jobs failed — publish whatever succeeded
    if: >-
      startsWith(github.ref, 'refs/tags/v') && always() &&
      (needs.desktop.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts/
          pattern: NeoWallet-*
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" -o -name "*.xcarchive" \) -exec cp {} release/ \; 2>/dev/null || true
          if [ -z "$(ls -A release/)" ]; then
            echo "::error::No release assets found"
            exit 1
          fi
          echo "## Release assets:"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
