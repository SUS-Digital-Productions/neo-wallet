name: Publish Rust Crates

# Build, test, tag, and create a GitHub Release for eosio-abi and eosio-signer.
# Other projects consume them as git dependencies:
#
#   [dependencies]
#   eosio-abi    = { git = "https://github.com/SUS-Digital-Productions/neo-wallet", tag = "crate-v0.1.0", path = "desktop/app/src-tauri/crates/eosio-abi" }
#   eosio-signer = { git = "https://github.com/SUS-Digital-Productions/neo-wallet", tag = "crate-v0.1.0", path = "desktop/app/src-tauri/crates/eosio-signer" }

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Creates tag crate-v{version}."
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CRATE_DIR: desktop/app/src-tauri/crates

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CRATE_DIR }}

      - name: Set version in Cargo.toml files
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting crate versions to $VERSION"

          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" $CRATE_DIR/eosio-abi/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" $CRATE_DIR/eosio-signer/Cargo.toml
          sed -i "s/eosio-abi = { path = \"..\/eosio-abi\", version = \"[^\"]*\"/eosio-abi = { path = \"..\/eosio-abi\", version = \"$VERSION\"/" $CRATE_DIR/eosio-signer/Cargo.toml

      - name: Check eosio-abi
        working-directory: ${{ env.CRATE_DIR }}/eosio-abi
        run: cargo check

      - name: Check eosio-signer
        working-directory: ${{ env.CRATE_DIR }}/eosio-signer
        run: cargo check

      - name: Test eosio-abi
        working-directory: ${{ env.CRATE_DIR }}/eosio-abi
        run: cargo test

      - name: Test eosio-signer
        working-directory: ${{ env.CRATE_DIR }}/eosio-signer
        run: cargo test

      - name: Commit version bump
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CRATE_DIR/eosio-abi/Cargo.toml $CRATE_DIR/eosio-signer/Cargo.toml
          git diff --cached --quiet && echo "No version changes to commit" || \
            git commit -m "chore: bump eosio crates to v$VERSION"

      - name: Create and push tag
        run: |
          TAG="crate-v${{ inputs.version }}"
          git tag -a "$TAG" -m "eosio-abi & eosio-signer v${{ inputs.version }}"
          git push origin HEAD "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crate-v${{ inputs.version }}
          name: "Rust Crates v${{ inputs.version }}"
          body: |
            ## eosio-abi & eosio-signer v${{ inputs.version }}

            ### Usage

            Add to your `Cargo.toml`:

            ```toml
            [dependencies]
            eosio-abi = { git = "https://github.com/SUS-Digital-Productions/neo-wallet", tag = "crate-v${{ inputs.version }}", path = "desktop/app/src-tauri/crates/eosio-abi" }
            eosio-signer = { git = "https://github.com/SUS-Digital-Productions/neo-wallet", tag = "crate-v${{ inputs.version }}", path = "desktop/app/src-tauri/crates/eosio-signer" }
            ```

            ### Crates

            | Crate | Description |
            |-------|-------------|
            | **eosio-abi** | Dynamic ABI codec for Antelope (EOSIO) — encode/decode action data |
            | **eosio-signer** | Secp256k1 transaction signing, WIF key management, binary serialization |
          generate_release_notes: true

      - name: Summary
        run: |
          VERSION="${{ inputs.version }}"
          echo "## Crate Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| eosio-abi | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| eosio-signer | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```toml' >> $GITHUB_STEP_SUMMARY
          echo "[dependencies]" >> $GITHUB_STEP_SUMMARY
          echo "eosio-abi = { git = \"https://github.com/SUS-Digital-Productions/neo-wallet\", tag = \"crate-v$VERSION\", path = \"desktop/app/src-tauri/crates/eosio-abi\" }" >> $GITHUB_STEP_SUMMARY
          echo "eosio-signer = { git = \"https://github.com/SUS-Digital-Productions/neo-wallet\", tag = \"crate-v$VERSION\", path = \"desktop/app/src-tauri/crates/eosio-signer\" }" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
